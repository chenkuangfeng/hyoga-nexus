# Copy to configs/nexus.toml and fill in local values. This file is the only source of deployment
# configuration: environment variables and .env files are not read. configs/nexus.toml is git-ignored.

[database]
# Local SQLite file, relative to the working directory (repository root).
url = "sqlite:///./nexus.db"
# PostgreSQL for shared or production-like deployments; replace the SQLite line above with this when needed.
# url = "postgresql+psycopg://nexus:CHANGE_ME@127.0.0.1:5432/nexus"

[auth]
# Sign-in model for the API: "development", "session" or "external". Leave unset for production-like runs.
# "development" skips the sign-in form: the web app signs in as the local account named by dev_user_id
# (default owner 9600543 created at API start). Requests are bound to 127.0.0.1 only and no account is created.
# "session" shows the password sign-in form (accounts created with the create-owner command or the default owner).
mode = "development"
dev_user_id = "9600543"
# Session cookies are Secure by default. This example turns that off for local HTTP; set it to true
# (or remove the line) for any deployment served over HTTPS.
cookie_secure = false

[logging]
# Worker log level: DEBUG, INFO, WARNING or ERROR.
level = "INFO"

[security]
# Fernet key shared by API and worker for encrypting saved model keys. Required before saving keys.
# Generate with: uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Do not replace a key that already encrypted stored data.
# The value below is a public development-only key: it is in the repository, so anyone can decrypt keys
# stored with it. Generate your own for any shared or production deployment.
credential_encryption_key = "HmvXsdL-PwdU0c6IqTPB3giNH_mdxuTqd1c_LjnnxGE="

[model_credentials]
# Named provider secrets used by Native Runs. Names must be upper-case identifiers and match the
# env://NAME handle stored with a provider credential. Only listed names can be resolved.
# MODEL_PROVIDER_KEY = ""

[model_network]
# Hostnames allowed to use http:// or private addresses for model providers (for example a local gateway).
# private_host_allowlist = ["127.0.0.1"]

[wecom]
# Enterprise WeChat internal-app QR login. Leave empty to keep it disabled.
# corp_id = ""
# agent_id = ""
# secret = ""
# redirect_uri = ""

[platform]
# Sessions allowed to hold queued, started or unknown work at once; new sessions beyond this get 503.
max_concurrent_sessions = 8
# Fairness limits on top of the cap above (distinct sessions holding work). Off unless set; beyond them a
# new session gets 429 session_limit_reached while Runs in sessions already holding a slot are still accepted.
# max_concurrent_sessions_per_tenant = 4
# max_concurrent_sessions_per_user = 2

[deployment]
# split (default): the API and one or more worker processes (`python -m nexus_worker`) run separately.
# embedded: the API process also runs the workers, with the in-process memory event channel and no Redis.
# One worker executes one Run at a time, so embedded_workers is how many Runs can execute at once.
mode = "split"
# embedded_workers = 4
# Idle-time jobs (schedules, knowledge index, memory capture and consolidation, embeddings) while embedded.
# background_concurrency = 1

[run_events]
# How a Run's live events travel from the worker to viewers. Stored events always stay in the database; this
# only decides how fast viewers see them and whether streamed text (message.delta) is kept off the database.
#   database (default): no extra service; one shared poller per Run in each API process, text is stored.
#   redis: Redis Streams (install the extra: uv sync --extra redis); text is not stored, cancel wakes the worker.
#   memory: embedded mode only (API and worker in one process).
backend = "database"
# redis_url = "redis://localhost:6379/0"
# prefix = "nexus"
# maxlen = 4096                  # events kept per Run on the channel
# retention_seconds = 300        # how long a finished Run's stream stays readable
# heartbeat_seconds = 15
# poll_min_ms = 250              # database backend: poll interval bounds
# poll_max_ms = 1000
# lease_check_seconds = 1.0      # worker's database lease and cancel check; 5.0 when the channel wakes the worker

[model_limits]
# Cap on concurrent background model calls (memory capture, consolidation, knowledge enrichment) per model, so
# they cannot use up a provider's rate limit that interactive Runs need. Interactive Runs are never held back.
# max_background_per_model = 4

[model_connection_pool]
# Per provider origin, shared by worker Native Runs. Applied when the worker starts.
max_connections = 100
max_keepalive_connections = 20
keepalive_expiry_seconds = 5.0

[watchdog]
# Run watchdog: reports stalled running Runs as run.watchdog_alert events; it never cancels them.
# A Run idle this many seconds (no new events) is reported. Minimum 30.
idle_seconds = 300
# A Run whose newest tool calls repeat the same name and arguments this many times is reported. Minimum 2.
repeat_threshold = 3
# How often the worker checks each running Run, in seconds. Minimum 5. Read when the worker starts.
interval_seconds = 30

[knowledge]
# Knowledge bases (openspec 2026-11-06-knowledge-base). Builtin stores live under data_dir:
# original files in files/ (local storage backend) and the builtin SQLite vector store vectors.db.
data_dir = "data/knowledge"
# Largest accepted upload, in MB (1-1024).
max_upload_mb = 50
# Index jobs a worker runs at the same time (1-8). Parsing and embedding use memory; keep 1 on small hosts.
index_concurrency = 1

[sandbox]
# Sandbox for the file and command tools and for skill scripts (openspec 2026-11-07-tool-expansion, 2026-11-07-skill-evolution).
# Off by default. The operator defines named profiles; an agent picks one by name (its `sandbox_profile` setting) and can
# never create or change one. Enabling is not enough: run `uv run python -m nexus_worker --sandbox-check` (every
# docker and bwrap profile, or --profile NAME) and have it pass, then switch the "sandbox" tool group on per agent.
# A report is stored per profile under workspace_root and is valid only for the profile's type, image and limits.
enabled = false
# Profile used by agents that name none. "local" is for development only: it runs commands as the server user with NO
# isolation and is usable only with allow_local = true AND the development auth mode. In production, point this at a
# docker or bwrap profile (or name one per agent).
default_profile = "local"
workspace_root = "data/sandbox"
allow_local = false
# Lets builtin skills that declare `execution = "local"` run on a `local` profile. Development only.
allow_local_scripts = false

[sandbox.profiles.local]
type = "local"

# [sandbox.profiles.docker]
# type = "docker"                  # one container per session, hardened: non-root, read-only root, no capabilities
# image = "python:3.12-slim"       # must already be present (never pulled); needs sh, timeout and python3
# cpus = 1.0
# memory_mb = 512
# pids = 128
# network = "none"                 # none | bridge. "bridge" opens it, and then every command asks for approval
# install_network = "bridge"       # network of the temporary environment that builds a skill's dependencies
# tmpfs_mb = 64
# idle_seconds = 900
# workspace_quota_mb = 512
# exec_timeout_max_seconds = 120   # ceiling of one sandbox_exec call
# build_timeout_seconds = 600      # wall-clock limit of building one skill's dependency environment
# env_max_mb = 512                 # size limit of a built environment
# skill_timeout_seconds = 120      # default and ceiling of one exec_skill call
# skill_timeout_max_seconds = 600
# env_passthrough = []             # host variable names to forward; names that look like credentials are refused

# [sandbox.profiles.bwrap]
# type = "bwrap"                   # bubblewrap (Linux): a namespace jail per command, the host's /usr mounted read-only
# memory_mb = 512                  # address-space limit; there is no process-count limit and no CPU quota
# network = "none"                 # none | bridge
# install_network = "bridge"
# workspace_quota_mb = 512
# exec_timeout_max_seconds = 120
#                                  # no background commands (sandbox_exec_async is refused)
#
# The older flat layout (backend, image, cpus ... directly under [sandbox]) still works: it defines one profile named "default".

[skills]
# Folder whose skill sub-folders become builtin skills (assignable in every space). Imported by a platform administrator
# with `uv run python -m nexus_api.cli import-builtin-skills` or POST /api/v1/platform/skills/import-builtin.
builtin_dir = "skills"

[web]
# Outbound web access for the "web" tool group (web_search, web_fetch). Off by default. Enabling it only makes the
# group available: each agent still has to switch it on. web_fetch refuses non-public addresses on every hop.
enabled = false
# Search provider for web_search: "tavily", "brave" or "searxng" (empty = web_search reports no backend).
# The request shapes follow each provider's public API and have not been exercised against the live services.
search_backend = ""
search_api_key = ""
# Base URL of your SearXNG instance (JSON output must be enabled there). It is set by you, so it may be internal.
search_url = ""
timeout_seconds = 15
fetch_max_bytes = 2000000
fetch_max_chars = 20000
