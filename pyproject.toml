[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "hyoga-nexus"
version = "0.1.0"
description = "Extensible agent platform with Guanlan stock research application"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "hyoga-nexus-core", "hyoga-nexus-runtimes", "hyoga-nexus-connectors", "hyoga-nexus-skills", "hyoga-nexus-guanlan"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/nexus_api", "apps/worker/src/nexus_worker"]
[tool.uv.workspace]
members = ["packages/*"]
[tool.uv.sources]
hyoga-nexus-core = { workspace = true }
hyoga-nexus-runtimes = { workspace = true }
hyoga-nexus-connectors = { workspace = true }
hyoga-nexus-skills = { workspace = true }
hyoga-nexus-guanlan = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
