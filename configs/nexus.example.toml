# Copy to configs/nexus.toml and fill in local values. This file is the only source of deployment
# configuration: environment variables and .env files are not read. configs/nexus.toml is git-ignored.

[database]
# Local SQLite file, relative to the working directory (repository root).
url = "sqlite:///./nexus.db"
# PostgreSQL for shared or production-like deployments; replace the SQLite line above with this when needed.
# url = "postgresql+psycopg://nexus:CHANGE_ME@127.0.0.1:5432/nexus"

[auth]
# Sign-in model for the API: "development", "session" or "external". Leave unset for production-like runs.
# "development" gives every request one fixed identity: local machine only, API bound to 127.0.0.1.
# "session" shows the password sign-in form (accounts created with the create-owner command or the default owner).
# The default is "session" so a fresh copy of this file can sign in over local HTTP without extra edits.
mode = "session"
# dev_user_id = "local-developer"
# Session cookies are Secure by default. This example turns that off for local HTTP; set it to true
# (or remove the line) for any deployment served over HTTPS.
cookie_secure = false

[logging]
# Worker log level: DEBUG, INFO, WARNING or ERROR.
level = "INFO"

[security]
# Fernet key shared by API and worker for encrypting saved model keys. Required before saving keys.
# Generate with: uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Do not replace a key that already encrypted stored data.
# credential_encryption_key = ""

[model_credentials]
# Named provider secrets used by Native Runs. Names must be upper-case identifiers and match the
# env://NAME handle stored with a provider credential. Only listed names can be resolved.
# MODEL_PROVIDER_KEY = ""

[model_network]
# Hostnames allowed to use http:// or private addresses for model providers (for example a local gateway).
# private_host_allowlist = ["127.0.0.1"]

[wecom]
# Enterprise WeChat internal-app QR login. Leave empty to keep it disabled.
# corp_id = ""
# agent_id = ""
# secret = ""
# redirect_uri = ""

[platform]
# Sessions allowed to hold queued, started or unknown work at once; new sessions beyond this get 503.
max_concurrent_sessions = 8

[model_connection_pool]
# Per provider origin, shared by worker Native Runs. Applied when the worker starts.
max_connections = 100
max_keepalive_connections = 20
keepalive_expiry_seconds = 5.0

[watchdog]
# Run watchdog: reports stalled running Runs as run.watchdog_alert events; it never cancels them.
# A Run idle this many seconds (no new events) is reported. Minimum 30.
idle_seconds = 300
# A Run whose newest tool calls repeat the same name and arguments this many times is reported. Minimum 2.
repeat_threshold = 3
# How often the worker checks each running Run, in seconds. Minimum 5. Read when the worker starts.
interval_seconds = 30
