[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "hyoga-nexus-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=46,<48",
    "hyoga-nexus-core",
    "hyoga-nexus-mcp",
    "hyoga-nexus-memory",
    "hyoga-nexus-skills",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]
[tool.hatch.build.targets.wheel]
packages = ["src/nexus_platform"]
