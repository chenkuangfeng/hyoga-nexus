[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "hyoga-nexus-knowledge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "hyoga-nexus-core",
    "networkx==3.6.1",
    "olefile==0.47",
    "psycopg[binary]>=3.2,<4",
    "pypdf==6.21.4",
    "xlrd==2.0.2",
]
[tool.hatch.build.targets.wheel]
packages = ["src/nexus_knowledge"]
