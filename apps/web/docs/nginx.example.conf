# Nginx HTTP context: define the WebSocket connection variable once.
map $http_upgrade $nexus_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nexus.example.com;

    # Deployment layout:
    #   /srv/nexus/workspace/  <- apps/web/workspace/dist contents
    #   /srv/nexus/admin/      <- apps/web/admin/dist contents
    # This example shows routing only. Add the deployment's TLS listener and
    # certificate directives, or serve it behind a trusted TLS load balancer.

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nexus_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /wecom/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite builds admin with base=/admin/. Keep that prefix when serving files
    # and fall back to its own index for history-mode routes.
    location ^~ /admin/ {
        root /srv/nexus;
        try_files $uri $uri/ /admin/index.html;
    }

    # embed.html is a separate Vite entry; all channel URLs use this SPA route.
    location = /embed {
        return 308 /embed/;
    }
    location ^~ /embed/ {
        root /srv/nexus/workspace;
        try_files $uri /embed.html;
    }

    # Main employee workspace history routes.
    location / {
        root /srv/nexus/workspace;
        try_files $uri $uri/ /index.html;
    }
}
