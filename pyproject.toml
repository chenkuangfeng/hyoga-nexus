[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "hyoga-nexus"
version = "0.1.0"
description = "Extensible agent platform with Guanlan stock research application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    # The API uses HTTP/SSE; don't install unused native, WebSocket or YAML extras.
    "uvicorn>=0.30,<1",
    "hyoga-nexus-core",
    "hyoga-nexus-platform",
    "hyoga-nexus-runtimes",
    "hyoga-nexus-skills",
    "hyoga-nexus-tools",
    "hyoga-nexus-mcp",
    "hyoga-nexus-knowledge",
    "hyoga-nexus-memory",
    "hyoga-nexus-sandbox",
    "hyoga-nexus-connectors",
    "hyoga-nexus-guanlan",
    "python-multipart>=0.0.20,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "redis>=5,<9", "fakeredis[lua]>=2.26,<3"]
redis = ["redis>=5,<9"]
[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/nexus_api", "apps/worker/src/nexus_worker"]
[tool.uv.workspace]
members = ["packages/*"]
[tool.uv.sources]
hyoga-nexus-core = { workspace = true }
hyoga-nexus-platform = { workspace = true }
hyoga-nexus-runtimes = { workspace = true }
hyoga-nexus-skills = { workspace = true }
hyoga-nexus-tools = { workspace = true }
hyoga-nexus-mcp = { workspace = true }
hyoga-nexus-knowledge = { workspace = true }
hyoga-nexus-memory = { workspace = true }
hyoga-nexus-sandbox = { workspace = true }
hyoga-nexus-connectors = { workspace = true }
hyoga-nexus-guanlan = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
